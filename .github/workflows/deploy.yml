name: Deploy FixMySpot Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fixmyspot-frontend/package-lock.json

      - name: Validate production API URL
        working-directory: ./fixmyspot-frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::GitHub repository variable VITE_API_URL is missing. Set it to your deployed backend URL ending in /api."
            exit 1
          fi
          echo "Production API URL configured: $VITE_API_URL"

      - name: Install frontend dependencies
        working-directory: ./fixmyspot-frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./fixmyspot-frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Add SPA fallback for GitHub Pages
        run: cp fixmyspot-frontend/dist/index.html fixmyspot-frontend/dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./fixmyspot-frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
